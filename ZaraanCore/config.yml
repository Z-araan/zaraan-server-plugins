announce:
  enabled: true
  interval-seconds: 900
  prefix: '&8[&7提示&8] &7'
  messages:
  - 输入 &f/menu &7或右键菜单物品,大部分功能都能点出来!
  - 想去远处探险? &f/rtp &7一键随机传送!
  - 每天 &f/psi &7签到领金币和物品,连续签到奖励更丰厚!
  - '玩家交易不用跑腿: &f/market &7菜单里直接买卖!'
  - '组队打怪: &f/team &7图形化建队, &f/tc &7队伍聊天'
  - '把自己家设成传送点: &f/mwarp &7菜单操作,朋友随时来参观!'
  - '网页地图: &bzaraan.zh.kg:8081'
  - 'QQ交流群: &b1077962353'
rtp:
  enabled: true
  cooldown-seconds: 180
  min-radius: 800
  max-radius: 5000
  world: world
  warmup-seconds: 3
party:
  max-members: 8
ai:
  enabled: false
  api-url: https://api.deepseek.com/v1/chat/completions
  api-key: ''
  model: deepseek-chat
market:
  max-listings-per-player: 10
  max-price: 1000000
  tax-percent: 5
spawn-protection:
