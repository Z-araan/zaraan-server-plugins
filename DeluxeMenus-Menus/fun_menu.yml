# 玩法中心
open_command:
  - funmenu
register_command: true
size: 45
menu_title: '&8zaraan星火之域 &7» &6玩法中心'

items:
  border:
    material: GRAY_STAINED_GLASS_PANE
    display_name: ' '
    slots:
      - 0-9
      - 17-18
      - 26-27
      - 35-36
      - 37-44

  signin:
    material: CLOCK
    slot: 10
    display_name: '&e&l每日签到'
    lore:
      - '&7每天签到领金币'
      - '&7连续签到 7 天 / 满月有额外奖励'
      - ''
      - '&e点击签到'
    left_click_commands:
      - '[player] psi signIn'
      - '[close]'

  quests:
    material: WRITABLE_BOOK
    slot: 12
    display_name: '&6&l任务中心'
    lore:
      - '&7任务日志 / 任务列表 / 排行 / 统计'
      - '&7完成获得丰厚奖励!'
      - ''
      - '&e点击打开任务中心'
    left_click_commands:
      - '[openguimenu] quests_menu'
      - '[close]'

  crates:
    material: CHEST
    slot: 14
    display_name: '&c&l抽奖箱'
    lore:
      - '&7用钥匙或金币抽奖'
      - '&7奖品包含稀有物品和金币'
      - ''
      - '&e点击查看奖池'
    left_click_commands:
      - '[player] crates'
      - '[close]'

  title:
    material: NAME_TAG
    slot: 16
    display_name: '&d&l称号商城'
    lore:
      - '&7购买并佩戴专属称号'
      - '&7称号会显示在聊天和 TAB 里'
      - ''
      - '&e点击打开'
    left_click_commands:
      - '[player] plt open'
      - '[close]'

  particles:
    material: BLAZE_POWDER
    slot: 20
    display_name: '&b&l粒子特效'
    lore:
      - '&7给自己加上炫酷粒子'
      - '&7可以设置多个粒子组合'
      - ''
      - '&e点击打开'
    left_click_commands:
      - '[player] pp gui'
      - '[close]'

  party:
    material: IRON_SWORD
    slot: 22
    display_name: '&6&l组队系统'
    lore:
      - '&7和朋友一起冒险!'
      - '&7建队/邀请/踢人一键搞定'
      - '&7还能用 &f/tc &7开队伍专属聊天'
      - ''
      - '&e点击打开组队'
    left_click_commands:
      - '[player] team'

  rank:
    material: DIAMOND
    slot: 24
    display_name: '&b&l金币排行榜'
    lore:
      - '&7看看谁是本服首富'
      - ''
      - '&e点击查看'
    left_click_commands:
      - '[player] baltop'
      - '[close]'

  back:
    material: ARROW
    slot: 40
    display_name: '&e返回主菜单'
    left_click_commands:
      - '[openguimenu] main_menu'
